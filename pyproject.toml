[project]
name = "graph-code-intelligence"
version = "0.1.0"
description = "A graph-augmented code intelligence engine for structural code retrieval, ranking, and context compilation."
requires-python = ">=3.14"
dependencies = [
    "faiss-cpu>=1.15,<1.16",
    "numpy>=2.5,<3",
    "tree-sitter>=0.26,<0.27",
    "tree-sitter-cpp==0.23.4",
    "tree-sitter-python>=0.25,<0.26",
    "typer>=0.16.0",
]

[project.scripts]
aicode = "codeintel.cli:main"

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=6,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codeintel"]

[dependency-groups]
dev = [
    "mypy>=1.17.0",
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = [
    "tests/fixtures",
]

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "UP",
]

[tool.mypy]
python_version = "3.14"
strict = true
pretty = true
show_error_codes = true
files = [
    "src",
    "tests",
]
exclude = [
    "^tests/fixtures/",
]
